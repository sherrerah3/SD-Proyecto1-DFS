global
    log stdout format raw local0
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 2s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver docker-dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s

frontend dfs_frontend
    bind :8080
    default_backend metanode_leader

backend metanode_leader
    option httpchk GET /health/leader
    http-check expect status 200
    default-server inter 1s fall 2 rise 1
    # Always include the seed MetaNode. In HA it may be a follower; health check excludes it.
    server seed metanode:8080 check
    # server-template + Docker DNS discovers all replicas as Compose scales this service.
    server-template replica 1-20 metanode-replica:8080 check resolvers docker init-addr none
